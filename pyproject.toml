[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chatbot-app"
version = "1.0.0"
description = "FastAPI chat application with OpenAI and Gemini providers"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Copilot" }]
license = { text = "MIT" }

[tool.setuptools.packages.find]
include = ["src*"]
